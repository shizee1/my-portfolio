<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проект — Александр Петров</title>
<meta name="description" content="Подробно о работе: описание, скриншоты, ссылки на демо и репозиторий.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  (function(){var t;try{t=localStorage.getItem('theme')}catch(e){}
  if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t;document.documentElement.classList.add('js')})();
</script>
</head>
<body>
<div class="progress" aria-hidden="true"></div>

<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html">Александр Петров</a>
    <nav aria-label="Основное меню">
      <a href="index.html">Обо мне</a>
      <a href="works.html">Все работы</a>
      <a href="index.html#contact">Контакты</a>
      <button class="theme" type="button" aria-label="Сменить тему">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
      </button>
    </nav>
  </div>
</header>

<main>
  <section class="work-page" id="workPage">
    <div class="wrap">
      <div class="work-back">
        <a href="works.html" class="btn">&larr; К списку работ</a>
      </div>

      <article class="work-detail">
        <div class="work-detail-head">
          <h1 id="workTitle">Проект</h1>
          <div class="work-detail-tags" id="workTags"></div>
        </div>

        <p class="work-detail-desc" id="workDesc"></p>

        <div class="work-detail-actions">
          <a class="btn main" id="workDemo" href="#">Открыть демо</a>
          <a class="btn" id="workRepo" href="#">Репозиторий на GitHub</a>
        </div>

        <div class="work-detail-full">
          <h3>Описание</h3>
          <p id="workFullDesc"></p>
        </div>

        <div class="work-gallery">
          <h3>Скриншоты</h3>
          <div class="gallery-list" id="workGallery">
            <!-- изображения вставятся скриптом -->
          </div>
        </div>
      </article>

      <div class="work-not-found" id="workNotFound" style="display:none">
        <p>Работа не найдена.</p>
        <a href="works.html" class="btn main">К списку работ</a>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap">© 2026 Александр Петров</div></footer>
<div class="toast" role="status" aria-live="polite"></div>
<script src="js/works-data.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var id = params.get('id');
    var work = worksApi.get(id);

    var page = document.getElementById('workPage');
    var notFound = document.getElementById('workNotFound');

    if (!work) {
      page.style.display = 'none';
      notFound.style.display = 'block';
      document.title = 'Работа не найдена — Александр Петров';
      return;
    }

    document.title = work.title + ' — Александр Петров';
    document.getElementById('workTitle').textContent = work.title;
    document.getElementById('workDesc').textContent = work.shortDesc;
    document.getElementById('workFullDesc').textContent = work.fullDesc;

    var tagsEl = document.getElementById('workTags');
    work.tags.forEach(function (tag) {
      var span = document.createElement('span');
      span.textContent = tag;
      tagsEl.appendChild(span);
    });

    var demoEl = document.getElementById('workDemo');
    var repoEl = document.getElementById('workRepo');
    demoEl.href = work.demoUrl || '#';
    repoEl.href = work.repoUrl || '#';
    if (!work.demoUrl) {
      demoEl.style.display = 'none';
    }
    if (!work.repoUrl) {
      repoEl.style.display = 'none';
    }

    var gallery = document.getElementById('workGallery');
    var galleryHeading = gallery.previousElementSibling;

    work.screenshots.forEach(function (src, i) {
      var img = document.createElement('img');
      img.src = src;
      img.alt = work.title + ' — скриншот ' + (i + 1);
      img.loading = 'lazy';
      img.onerror = function () { this.style.display = 'none'; };
      gallery.appendChild(img);
    });

    if (work.screenshots.length === 0 && galleryHeading) {
      galleryHeading.style.display = 'none';
      gallery.style.display = 'none';
    }
  })();
</script>
<script src="js/main.js"></script>
</body>
</html>
